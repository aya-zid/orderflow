apiVersion: v1
kind: Secret
metadata:
  name: orderflow-secrets
  namespace: orderflow
type: Opaque
stringData:
  POSTGRES_USER: orderflow
  POSTGRES_PASSWORD: change-me
  RABBITMQ_USER: orderflow
  RABBITMQ_PASSWORD: change-me
  ORDER_DB_URL: postgres://orderflow:change-me@postgres:5432/order_db?sslmode=disable
  INVENTORY_DB_URL: postgres://orderflow:change-me@postgres:5432/inventory_db?sslmode=disable
  PAYMENT_DB_URL: postgres://orderflow:change-me@postgres:5432/payment_db?sslmode=disable
  NOTIFICATION_DB_URL: postgres://orderflow:change-me@postgres:5432/notification_db?sslmode=disable
