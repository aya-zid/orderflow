global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: orderflow
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - order:8081
          - inventory:8082
          - payment:8083
          - notification:8084
        labels:
          stack: orderflow
