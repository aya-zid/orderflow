openapi: 3.0.3
info:
  title: OrderFlow API
  description: |
    Event-driven order processing platform. Orders are accepted synchronously,
    then processed asynchronously by inventory, payment and notification
    services through RabbitMQ.
  version: 1.0.0
  contact:
    name: OrderFlow
    url: https://github.com/aya-zid/orderflow
servers:
  - url: http://localhost:8080
    description: Local gateway
tags:
  - name: Orders
    description: Order lifecycle endpoints
  - name: Health
    description: Liveness and readiness probes
paths:
  /v1/orders:
    post:
      tags: [Orders]
      summary: Create an order
      description: |
        Requires an `Idempotency-Key` header. Replaying the same key returns the
        previously created order instead of creating a duplicate.
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
          example: 3f1c2a9e-8b7d-4c6a-9e1f-2d3c4b5a6f70
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              customer_id: cust-42
              currency: EUR
              items:
                - sku: SKU-1
                  quantity: 2
                  unit_price_cents: 1999
      responses:
        '201':
          description: Order accepted for asynchronous processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Orders]
      summary: List orders
      operationId: listOrders
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  limit:
                    type: integer
                  offset:
                    type: integer
  /v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order and its status timeline
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order
      description: Cancellation triggers a compensating inventory release.
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 255
            example:
              reason: customer changed their mind
      responses:
        '200':
          description: The cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: health
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      operationId: ready
      responses:
        '200':
          description: All dependencies are reachable
        '503':
          description: At least one dependency is unavailable
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Invalid state transition or duplicate key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    CreateOrderRequest:
      type: object
      required: [customer_id, currency, items]
      properties:
        customer_id:
          type: string
          example: cust-42
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'
    CreateOrderItem:
      type: object
      required: [sku, quantity, unit_price_cents]
      properties:
        sku:
          type: string
          example: SKU-1
        quantity:
          type: integer
          minimum: 1
          example: 2
        unit_price_cents:
          type: integer
          minimum: 0
          example: 1999
    Order:
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        customer_id:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        currency:
          type: string
        total_cents:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItem'
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        history:
          type: array
          items:
            $ref: '#/components/schemas/StatusChange'
    OrderStatus:
      type: string
      enum: [PENDING, RESERVED, PAID, CONFIRMED, CANCELLED]
    StatusChange:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        reason:
          type: string
        event_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
